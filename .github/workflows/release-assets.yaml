# This script uploads application binaries as GitHub release assets.
name: release-assets
on:
  release:
    types:
      - created
env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  TAG_NAME: ${{ github.event.release.tag_name }}

permissions: { }

jobs:
  build:
    name: Upload Release Assets
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Install Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build artifacts
        run: |
          make artifacts
      - name: Upload linux amd64 binary
        run: gh release upload "$TAG_NAME" ./_artifacts/godog-$TAG_NAME-linux-amd64.tar.gz --clobber
      - name: Upload linux arm64 binary
        run: gh release upload "$TAG_NAME" ./_artifacts/godog-$TAG_NAME-linux-arm64.tar.gz --clobber
      - name: Upload darwin amd64 binary
        run: gh release upload "$TAG_NAME" ./_artifacts/godog-$TAG_NAME-darwin-amd64.tar.gz --clobber
